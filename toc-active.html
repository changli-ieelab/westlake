<script>
document.addEventListener("DOMContentLoaded", function () {
  const tocLinks = document.querySelectorAll("#TOC a");
  const sections = [];

  tocLinks.forEach(link => {
    const href = link.getAttribute("href");

    if (href && href.startsWith("#")) {
      const section = document.querySelector(href);

      if (section) {
        sections.push({
          link: link,
          section: section
        });
      }

      // 点击 TOC 后，把目标标题放到页面约 30% 高度处
      link.addEventListener("click", function (e) {
        const target = document.querySelector(href);

        if (!target) return;

        e.preventDefault();

        const targetY =
          target.getBoundingClientRect().top +
          window.scrollY -
          window.innerHeight * 0.30;

        window.scrollTo({
          top: targetY,
          behavior: "smooth"
        });

        // 更新网址中的 #section
        history.replaceState(null, "", href);
      });
    }
  });


  function updateTOC() {
    let current = null;

    sections.forEach(item => {
      const rect = item.section.getBoundingClientRect();

      if (rect.top <= 250) {
        current = item;
      }
    });

    tocLinks.forEach(link => {
      link.classList.remove("active");
    });

    if (current) {
      current.link.classList.add("active");
    }
  }


  window.addEventListener("scroll", updateTOC);

  updateTOC();  

    // Add "Back to top" link below TOC
  const toc = document.querySelector("#TOC");

  if (toc) {
    const backToTop = document.createElement("a");

    backToTop.href = "#";
    backToTop.className = "back-to-top";
    backToTop.innerHTML = "Back to top ↑";

    backToTop.addEventListener("click", function (e) {
      e.preventDefault();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    toc.appendChild(backToTop);
  }
  
  // Add sidebar logos
const marginSidebar = document.querySelector("#quarto-margin-sidebar");

if (marginSidebar) {
  const logoBox = document.createElement("div");
  logoBox.className = "sidebar-logos";

  logoBox.innerHTML = `
    <img class="chang-logo" src="images/site-logo.jpg" alt="Chang Group">
    <img class="westlake-logo" src="images/westlake-logo.png" alt="Westlake University">
  `;

  marginSidebar.appendChild(logoBox);
}
});
</script>
