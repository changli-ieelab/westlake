<script>
document.addEventListener("DOMContentLoaded", function () {

  const toc = document.querySelector("#TOC");
  if (!toc) return;

  /*
   * TOC links
   */
  const tocLinks = Array.from(
    toc.querySelectorAll('a[href^="#"]')
  );

  /*
   * Handle TOC clicks ourselves.
   *
   * Capture phase is important:
   * it runs before Quarto's own click handlers,
   * avoiding conflicts between the two.
   */
  toc.addEventListener(
    "click",
    function (e) {

      const link = e.target.closest('a[href^="#"]');

      if (!link || !toc.contains(link)) return;

      const href = link.getAttribute("href");

      if (!href || href === "#") return;

      const id = decodeURIComponent(
        href.substring(1)
      );

      const target =
        document.getElementById(id);

      if (!target) return;

      e.preventDefault();
      e.stopPropagation();

      /*
       * Position the target below the navbar.
       */
      const targetY =
        target.getBoundingClientRect().top +
        window.scrollY -
        80;

      window.scrollTo({
        top: Math.max(0, targetY),
        behavior: "auto"
      });

      /*
       * Update URL without triggering another scroll.
       */
      history.replaceState(
        null,
        "",
        href
      );

    },
    true
  );


  /*
   * Active TOC highlighting
   */
  const sections = [];

  tocLinks.forEach(link => {

    const href = link.getAttribute("href");

    if (!href || href === "#") return;

    const id = decodeURIComponent(
      href.substring(1)
    );

    const section =
      document.getElementById(id);

    if (!section) return;

    sections.push({
      link: link,
      section: section
    });

  });


  function updateTOC() {

    let current = null;

    sections.forEach(item => {

      const rect =
        item.section.getBoundingClientRect();

      if (rect.top <= 250) {
        current = item;
      }

    });

    tocLinks.forEach(link => {
      link.classList.remove("active");
    });

    if (current) {
      current.link.classList.add("active");
    }

  }


  window.addEventListener(
    "scroll",
    updateTOC,
    { passive: true }
  );

  updateTOC();


  /*
   * Back to top
   */
  const backToTop =
    document.createElement("a");

  backToTop.href = "#";
  backToTop.className = "back-to-top";
  backToTop.innerHTML = "Back to top ↑";

  backToTop.addEventListener(
    "click",
    function (e) {

      e.preventDefault();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      history.replaceState(
        null,
        "",
        window.location.pathname
      );

    }
  );

  toc.appendChild(backToTop);


  /*
   * Sidebar logos
   */
  const marginSidebar =
    document.querySelector(
      "#quarto-margin-sidebar"
    );

  if (marginSidebar) {

    const logoBox =
      document.createElement("div");

    logoBox.className =
      "sidebar-logos";

    logoBox.innerHTML = `
      <img class="chang-logo"
           src="images/site-logo.jpg"
           alt="Chang Group">

      <img class="westlake-logo"
           src="images/westlake-logo.png"
           alt="Westlake University">
    `;

    marginSidebar.appendChild(
      logoBox
    );

  }

});
</script>
